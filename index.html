body{margin:0;background:var(--mesa);color:var(--papel);font:16px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;min-height:48px;padding:10px 18px;font-weight:800;color:var(--tinta);background:var(--papel);transition:transform .15s}
button:active{transform:scale(.97)}button:focus-visible,input:focus-visible{outline:3px solid var(--mostaza);outline-offset:2px}
button.pri{background:var(--mostaza)}button.ghost{background:transparent;color:var(--papel);border:2px solid var(--linea)}button[disabled]{opacity:.35;cursor:default}
.sello{display:inline-block;font-family:Bungee;color:var(--rojo);border:3px solid var(--rojo);border-radius:10px;padding:4px 12px 2px;transform:rotate(-2deg);line-height:1}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(4vw,14px);background:var(--mesa2);position:sticky;top:0;z-index:5}
header .sello{font-size:20px;color:var(--papel);border-color:var(--papel)}header .info{font-size:13px;color:var(--gris);text-align:right}
.score{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:8px;padding:12px max(4vw,14px)}
.pl{background:var(--mesa2);border-radius:14px;padding:8px 10px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center;border:2px solid transparent}
.pl.on{border-color:var(--mostaza)}.pl.yo{box-shadow:inset 0 0 0 2px var(--papel)}
.dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:Bungee;font-size:13px;color:var(--papel);flex:none}
.pl .n{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pl .p{font-family:Bungee;font-size:20px}
.pl .bar{grid-column:1/-1;height:6px;border-radius:3px;background:var(--linea);overflow:hidden}.pl .bar i{display:block;height:100%}
.pl .docs{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px;font-size:11px;align-items:center;color:var(--gris)}
.dk{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-family:Bungee;font-size:11px;color:var(--papel)}
.dk.off{background:transparent!important;border:1.5px dashed var(--gris);color:var(--gris)}
.off-line{opacity:.5}
main{padding:8px max(4vw,14px) 40px;max-width:1100px;margin:0 auto}
.mesa{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:clamp(16px,4vw,48px);align-items:start;margin-top:10px}
@media(max-width:700px){.mesa{grid-template-columns:1fr;justify-items:center}.mesa .lado{width:100%}}
h1,h2{font-family:Bungee;font-weight:400;line-height:1.05;margin:0 0 10px;text-wrap:balance}h2{font-size:clamp(22px,4vw,32px)}
.paso{font-weight:800;color:var(--mostaza);font-size:14px;margin-bottom:6px}.txt{color:#D6D9E6;max-width:62ch}
.acc{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.carta{width:min(300px,78vw);aspect-ratio:5/7;background:var(--papel);color:var(--tinta);border-radius:18px;position:relative;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.35);padding:18px;display:flex;flex-direction:column;animation:caer .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes caer{from{transform:translateY(-30px) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.carta,.rv,.dado.gira{animation:none!important}}
.carta .mk{position:absolute;right:14px;top:14px;font-family:Bungee;font-size:11px;line-height:.95;text-align:right;color:var(--rojo)}
.carta .t{font-family:Bungee;font-size:clamp(24px,6vw,30px);line-height:1;max-width:75%}
.carta .ic{width:42%;margin:10px 0 6px auto}.carta .ic svg{width:100%;height:auto;display:block}
.carta .o{font-weight:800;font-size:17px;line-height:1.2}.carta .f{font-size:13.5px;margin-top:6px;color:#4A5270}
.carta .pie{margin-top:auto;display:flex;align-items:center;gap:5px;font-size:11px;color:#7A8099}
.pill{margin-left:auto;font-family:Bungee;font-size:13px;color:var(--papel);border-radius:12px;padding:3px 10px}
.dorso{background:var(--mesa2);border:3px solid var(--linea);display:grid;place-items:center;text-align:center;color:var(--papel)}
.fila{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--mesa2);border-radius:12px;padding:8px 12px;font-weight:800}.chip.mal{opacity:.45}
.ofs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:14px}
.ofs button{font-family:Bungee;font-size:clamp(16px,4vw,24px);padding:16px 4px}.ofs small{display:block;font-family:Archivo;font-size:12px;font-weight:600}
.rev{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:14px}
.rv{background:var(--papel);color:var(--tinta);border-radius:14px;padding:12px;text-align:center;animation:caer .4s both}
.rv b{display:block;font-family:Bungee;font-size:28px}.rv.win{outline:4px solid var(--mostaza)}.rv.lose{opacity:.5}
.opts{display:grid;gap:10px;margin-top:14px}.opts button{text-align:left;display:flex;gap:12px;align-items:center;font-weight:600}
.opts button b{font-family:Bungee;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--morado);color:var(--papel);flex:none}
.opts .ok{background:#CDEBDD;opacity:1}.opts .no{background:#F4C9C3;opacity:1}.opts .gone{opacity:.25;text-decoration:line-through}
.big{font-family:Bungee;font-size:clamp(64px,16vw,130px);line-height:1;color:var(--mostaza)}
.dado{width:140px;height:140px;border-radius:26px;background:var(--azul);display:grid;place-items:center;text-align:center;font-family:Bungee;font-size:20px;line-height:1.1;color:var(--papel);margin-top:14px}
.dado.gira{animation:gira .5s linear 3}@keyframes gira{to{transform:rotate(360deg)}}
.panel{background:var(--mesa2);border-radius:18px;padding:16px;margin-top:14px}
input[type=text]{font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:2px solid var(--linea);background:var(--mesa);color:var(--papel);width:100%;min-height:48px}
.colores{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.colores button{width:52px;height:52px;border-radius:50%;padding:0;border:4px solid transparent}.colores button.sel{border-color:var(--papel)}
.colores button[disabled]{opacity:.2}
.modo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.modo button{text-align:left;font-weight:600;background:var(--mesa2);color:var(--papel);border:2px solid var(--linea);padding:14px}
.modo button.sel{border-color:var(--mostaza);background:#2C3763}.modo b{display:block;font-family:Bungee;font-weight:400;font-size:18px;color:var(--mostaza)}
.codigo{font-family:Bungee;font-size:clamp(40px,10vw,72px);letter-spacing:6px;color:var(--mostaza);line-height:1}
.link{word-break:break-all;font-size:14px;color:#D6D9E6;background:var(--mesa);border-radius:10px;padding:10px;margin-top:8px}
.log{font-size:13px;color:var(--gris);margin-top:22px}.err{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--rojo);color:var(--papel);padding:12px 18px;border-radius:14px;font-weight:800;z-index:20;max-width:90vw}
.estado{font-size:12px;color:var(--gris)}
</style>
</head>
<body>
<header><span class="sello">¡ADJUDICADO!</span><div class="info" id="info">en línea</div></header>
<section class="score" id="score" aria-label="Marcador"></section>
<main id="stage"><p class="txt">Cargando…</p></main>
<script>
{
const ICONS = {"chiguiro": "<svg viewBox=\"0 0 200 200\" aria-hidden=\"true\"><path d=\"M66 72 V54 a34 34 0 0 1 68 0 V72\" fill=\"none\" stroke=\"#24936E\" stroke-width=\"14\" stroke-linecap=\"round\"></path>\n<rect x=\"30\" y=\"68\" width=\"140\" height=\"124\" rx=\"18\" fill=\"#24936E\"></rect>\n<circle cx=\"66\" cy=\"92\" r=\"7\" fill=\"#F6F1E7\"></circle><circle cx=\"134\" cy=\"92\" r=\"7\" fill=\"#F6F1E7\"></circle>\n<text x=\"100\" y=\"172\" text-anchor=\"middle\" font-family=\"Bungee, sans-serif\" font-size=\"72\" fill=\"#F6F1E7\">$</text></svg>", "jaguar": "<svg viewBox=\"0 0 200 200\" aria-hidden=\"true\"><polygon points=\"100,8 190,62 10,62\" fill=\"#D9961F\"></polygon>\n<circle cx=\"100\" cy=\"42\" r=\"10\" fill=\"#F6F1E7\"></circle>\n<rect x=\"18\" y=\"70\" width=\"164\" height=\"12\" fill=\"#D9961F\"></rect>\n<rect x=\"30\" y=\"88\" width=\"22\" height=\"78\" fill=\"#D9961F\"></rect><rect x=\"70\" y=\"88\" width=\"22\" height=\"78\" fill=\"#D9961F\"></rect><rect x=\"108\" y=\"88\" width=\"22\" height=\"78\" fill=\"#D9961F\"></rect><rect x=\"148\" y=\"88\" width=\"22\" height=\"78\" fill=\"#D9961F\"></rect>\n<rect x=\"12\" y=\"172\" width=\"176\" height=\"20\" rx=\"4\" fill=\"#D9961F\"></rect></svg>", "guacamaya": "<svg viewBox=\"0 0 200 200\" aria-hidden=\"true\"><path d=\"M20 24 H112 L186 98 L108 176 L20 88 Z\" fill=\"#D9483B\" transform=\"rotate(8 100 100)\"></path>\n<circle cx=\"52\" cy=\"56\" r=\"11\" fill=\"#F6F1E7\"></circle>\n<path d=\"M106 62 V138\" stroke=\"#F6F1E7\" stroke-width=\"16\" stroke-linecap=\"round\"></path>\n<polyline points=\"78,112 106,142 134,112\" fill=\"none\" stroke=\"#F6F1E7\" stroke-width=\"16\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></polyline></svg>", "oso": "<svg viewBox=\"0 0 200 200\" aria-hidden=\"true\"><rect x=\"14\" y=\"18\" width=\"150\" height=\"150\" rx=\"10\" fill=\"#2F6FD0\"></rect>\n<path d=\"M14 58 H164 M14 98 H164 M14 138 H164 M54 18 V168 M94 18 V168 M134 18 V168\" stroke=\"#F6F1E7\" stroke-width=\"2\" opacity=\".35\"></path>\n<rect x=\"40\" y=\"70\" width=\"60\" height=\"50\" fill=\"none\" stroke=\"#F6F1E7\" stroke-width=\"7\"></rect><path d=\"M100 95 H140 V140 H60 V120\" fill=\"none\" stroke=\"#F6F1E7\" stroke-width=\"7\"></path>\n<polygon points=\"110,192 192,192 192,110\" fill=\"#1B2340\"></polygon><polygon points=\"146,180 180,180 180,146\" fill=\"#F6F1E7\"></polygon></svg>", "tortuga": "<svg viewBox=\"0 0 200 200\" aria-hidden=\"true\"><path d=\"M34 10 H130 L166 46 V190 H34 Z\" fill=\"#1E7C8C\"></path><path d=\"M130 10 V46 H166 Z\" fill=\"#A9BCE6\"></path>\n<rect x=\"54\" y=\"62\" width=\"76\" height=\"9\" rx=\"4\" fill=\"#F6F1E7\"></rect><rect x=\"54\" y=\"84\" width=\"90\" height=\"9\" rx=\"4\" fill=\"#F6F1E7\"></rect><rect x=\"54\" y=\"106\" width=\"64\" height=\"9\" rx=\"4\" fill=\"#F6F1E7\"></rect>\n<path d=\"M54 156 q12 -22 22 0 t22 0 t22 -6\" fill=\"none\" stroke=\"#1B2340\" stroke-width=\"6\" stroke-linecap=\"round\"></path>\n<circle cx=\"160\" cy=\"164\" r=\"30\" fill=\"#D9961F\"></circle><polyline points=\"146,164 156,175 175,152\" fill=\"none\" stroke=\"#F6F1E7\" stroke-width=\"8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></polyline></svg>", "rana": "<svg viewBox=\"0 0 200 200\" aria-hidden=\"true\"><path d=\"M100 12 L192 180 H8 Z\" fill=\"#E5732B\" stroke=\"#E5732B\" stroke-width=\"12\" stroke-linejoin=\"round\"></path>\n<rect x=\"89\" y=\"66\" width=\"22\" height=\"70\" rx=\"11\" fill=\"#F6F1E7\"></rect><circle cx=\"100\" cy=\"158\" r=\"12\" fill=\"#F6F1E7\"></circle></svg>", "buho": "<svg viewBox=\"0 0 200 200\" aria-hidden=\"true\"><path d=\"M30 20 H170 a20 20 0 0 1 20 20 V130 a20 20 0 0 1 -20 20 H90 L50 188 V150 H30 a20 20 0 0 1 -20 -20 V40 a20 20 0 0 1 20 -20 Z\" fill=\"#7357C9\"></path>\n<text x=\"100\" y=\"126\" text-anchor=\"middle\" font-family=\"Bungee, sans-serif\" font-size=\"100\" fill=\"#F6F1E7\">?</text></svg>", "titi": "<svg viewBox=\"0 0 200 200\" aria-hidden=\"true\"><rect x=\"36\" y=\"8\" width=\"128\" height=\"18\" rx=\"6\" fill=\"#B8457B\"></rect><rect x=\"36\" y=\"174\" width=\"128\" height=\"18\" rx=\"6\" fill=\"#B8457B\"></rect>\n<path d=\"M50 26 H150 C150 70 112 84 112 100 C112 116 150 130 150 174 H50 C50 130 88 116 88 100 C88 84 50 70 50 26 Z\" fill=\"none\" stroke=\"#B8457B\" stroke-width=\"10\" stroke-linejoin=\"round\"></path>\n<path d=\"M70 52 H130 C122 72 104 80 100 92 C96 80 78 72 70 52 Z\" fill=\"#B8457B\"></path><path d=\"M64 166 C72 140 94 130 100 120 C106 130 128 140 136 166 Z\" fill=\"#B8457B\"></path></svg>"};
const COLORS = ["#D9961F","#D9483B","#2F6FD0","#24936E","#1E7C8C","#E5732B","#7357C9","#B8457B"];
const C = {mostaza:'#D9961F',rojo:'#D9483B',azul:'#2F6FD0',verde:'#24936E',petroleo:'#1E7C8C',naranja:'#E5732B',morado:'#7357C9',vino:'#B8457B'};
const MOD = {minima:{t:'Mínima cuantía',pts:1,docs:'J',ic:'chiguiro',col:C.verde,f:'Compras pequeñas. Gana la oferta más barata.'},
 licitacion:{t:'Licitación pública',pts:3,docs:'JFT',ic:'jaguar',col:C.mostaza,f:'Contratos grandes. El dado de TRM decide la regla para ganar.'},
 subasta:{t:'Subasta inversa',pts:2,docs:'JF',ic:'guacamaya',col:C.rojo,f:'El precio baja en vivo. Gana el último en bajar.'},
 concurso:{t:'Concurso de méritos',pts:3,extra:2,docs:'JT',ic:'oso',col:C.azul,f:'Diseños y estudios. Gana el que más sabe, no el más barato.'},
 directa:{t:'Contratación directa',pts:2,docs:'T',ic:'tortuga',col:C.petroleo,f:'Casos especiales. Se le da a la empresa que va de último.'}};
const DOCN={J:'Jurídico',F:'Financiero',T:'Técnico'},DOCC={J:C.azul,F:C.verde,T:C.morado};
const RT={mimica:['Mímica','Actúalo sin hablar'],dibujo:['Dibujo','Dibújalo sin letras ni números (en papel o en el aire)'],sindecir:['Explícalo sin decir','No uses las palabras prohibidas'],rapido:['Rápido','Hazlo en 10 segundos']};
const RULE={menor:'MENOR<br>VALOR',mediana:'MEDIANA',media:'MEDIA<br>90'};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let AC;const beep=(f=520,d=.08)=>{try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.setValueAtTime(.1,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}};
const ding=()=>{beep(660,.1);setTimeout(()=>beep(990,.18),110)};

const params=new URLSearchParams(location.search);
const code=(params.get('sala')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
const KEY='adj_pid_'+code;
let pid=null; try{pid=localStorage.getItem(KEY)}catch(e){}
let ws=null, V=null, skew=0, lastStep='', myColor=null;

function toast(m){const d=document.createElement('div');d.className='err';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3500);beep(180,.25)}
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o));else toast('Sin conexión, reintentando…')}
const act=(a,extra={})=>send({t:'act',a,...extra});

function connect(){
  const proto=location.protocol==='https:'?'wss':'ws';
  ws=new WebSocket(`${proto}://${location.host}/ws?sala=${code}`);
  ws.onopen=()=>{send({t:'hello',pid});$('#info').textContent='Sala '+code+' · conectado'};
  ws.onmessage=e=>{const m=JSON.parse(e.data);
    if(m.t==='you'){pid=m.pid;try{if(pid)localStorage.setItem(KEY,pid)}catch(err){}}
    if(m.t==='err')toast(m.m);
    if(m.t==='state'){V=m.v;skew=V.now-Date.now();render()}};
  ws.onclose=()=>{$('#info').textContent='Sala '+code+' · reconectando…';setTimeout(connect,1500)};
}

/* ---------- piezas ---------- */
const P=i=>V.players[i], ME=()=>V.me, isCtrl=()=>V.me>=0&&(V.me===V.ord||V.players[V.me].id===V.host);
const chip=i=>`<span class="chip"><span class="dot" style="background:${P(i).color}"></span>${esc(P(i).name)}${i===V.me?' (tú)':''}</span>`;
const nm=i=>esc(P(i).name)+(i===V.me?' (tú)':'');
function cardHTML(c){
  if(!c)return `<div class="carta dorso"><div><span class="sello" style="font-size:22px">¡ADJUDICADO!</span><div style="margin-top:12px;font-family:Bungee">MAZO SECOP</div></div></div>`;
  if(c.k==='e')return `<div class="carta"><span class="mk">¡ADJU<br>DICADO!</span><div class="t" style="color:${C.naranja}">¡ÚLTIMA HORA!</div><div class="ic">${ICONS.rana}</div><div class="o" style="color:${C.naranja}">${esc(c.t)}</div><div class="f" style="color:var(--tinta);font-weight:600">${esc(c.pasa)}</div><div class="pie">${esc(c.ens)}</div></div>`;
  const m=MOD[c.m];
  return `<div class="carta"><span class="mk">¡ADJU<br>DICADO!</span><div class="t" style="color:${m.col}">${m.t.toUpperCase()}</div><div class="ic">${ICONS[m.ic]}</div><div class="o">${esc(c.o)}</div><div class="f">${m.f}</div>
  <div class="pie">PIDE ${m.docs.split('').map(k=>`<span class="dk" style="background:${DOCC[k]}">${k}</span>`).join('')}<span class="pill" style="background:${m.col}">${m.extra?m.pts+'+'+m.extra:m.pts} PTS</span></div></div>`;
}
function score(){
  $('#score').innerHTML=V.phase==='lobby'?'':V.players.map((p,i)=>`<div class="pl ${i===V.ord?'on':''} ${i===V.me?'yo':''} ${p.online?'':'off-line'}"><span class="dot" style="background:${p.color}">${i+1}</span><span class="n">${esc(p.name)}${i===V.me?' (tú)':''}</span><span class="p">${p.score}</span>
  <span class="bar"><i style="width:${Math.min(100,p.score/V.meta*100)}%;background:${p.color}"></i></span>
  <span class="docs">${'JFT'.split('').map(k=>`<span class="dk ${p.docs[k]?'':'off'}" style="background:${DOCC[k]}" title="${DOCN[k]}">${k}</span>`).join('')}<span style="margin-left:auto">50/50 × ${p.com}</span>${i===V.ord?'<span style="width:100%;color:var(--mostaza);font-weight:800">Ordenador del gasto</span>':''}${p.online?'':'<span style="width:100%">desconectado</span>'}</span></div>`).join('');
  $('#info').textContent=V.phase==='lobby'?`Sala ${V.code}`:`Sala ${V.code} · turno ${V.turn} · meta ${V.meta}`;
}
function screen(left,right){$('#stage').innerHTML=`<div class="mesa"><div>${left}</div><div class="lado">${right}</div></div>`+(V.log&&V.log.length?`<div class="log">${V.log.map(esc).join('<br>')}</div>`:'')}
const wait=t=>`<p class="txt estado">⏳ ${t}</p>`;
const btn=(id,label,cls='pri',dis=false)=>`<button class="${cls}" id="${id}" ${dis?'disabled':''}>${label}</button>`;
function qPanel(q,{gone=[],r,pick,click=false}={}){
  return `<div class="panel"><div class="paso" style="color:${C.morado}">Pregunta n.º ${q.n}</div><h2 style="font-size:clamp(19px,3.2vw,25px)">${esc(q.q)}</h2>
  <div class="opts">${q.o.map((t,i)=>`<button data-i="${i}" class="${gone.includes(i)?'gone':''} ${r!==undefined&&r!==null&&i===r?'ok':''} ${pick===i&&i!==r?'no':''}" ${!click||gone.includes(i)?'disabled':''}><b>${'ABC'[i]}</b>${esc(t)}</button>`).join('')}</div></div>`;
}
const tiles=(offers,win=[])=>`<div class="rev">${Object.keys(offers).map(Number).map(i=>`<div class="rv ${win.length?(win.includes(i)?'win':'lose'):''}" style="border-top:8px solid ${P(i).color}">${esc(P(i).name)}<b>${offers[i]}%</b></div>`).join('')}</div>`;
const remain=ends=>Math.max(0,Math.ceil((ends-(Date.now()+skew))/1000));

/* ---------- pantallas ---------- */
function landing(){
  $('#score').innerHTML='';
  $('#stage').innerHTML=`<div class="mesa"><div><div class="carta"><span class="mk">¡ADJU<br>DICADO!</span><div class="t" style="color:${C.rojo}">¿TU EMPRESA SE GANA EL CONTRATO?</div><div class="ic" style="width:56%">${ICONS.jaguar}</div><div class="f" style="color:var(--tinta)">El juego de la contratación estatal, cada jugador en su propio celular.</div><div class="pie">de 2 a 8 empresas · ideal 4</div></div></div>
  <div class="lado"><h1 style="font-size:clamp(30px,5vw,46px)">Juega en línea</h1><p class="txt">Crea una sala y comparte el enlace con tu grupo. Cada uno entra desde su dispositivo, escribe su nombre y elige su color.</p>
  <div class="acc">${btn('crear','Crear sala nueva')}</div>
  <div class="panel"><b>¿Ya tienes un código?</b><div class="acc" style="margin-top:8px"><input type="text" id="cod" maxlength="6" placeholder="Ej.: KXPT" aria-label="Código de sala" style="max-width:200px;text-transform:uppercase">${btn('unir','Unirme','ghost')}</div></div></div></div>`;
  $('#crear').onclick=()=>{const L='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<4;i++)c+=L[Math.floor(Math.random()*L.length)];location.search='?sala='+c};
  $('#unir').onclick=()=>{const c=$('#cod').value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(c)location.search='?sala='+c};
}
function joinForm(){
  const taken=V.players.map(p=>p.color); if(!myColor||taken.includes(myColor))myColor=COLORS.find(c=>!taken.includes(c));
  screen(cardHTML(null),`<div class="paso">Sala ${esc(V.code)}</div><h2>Entra a la partida</h2>
  ${V.phase!=='lobby'?`<p class="txt">Esta partida ya empezó. Puedes mirarla, pero no unirte.</p>`:V.players.length>=8?`<p class="txt">La sala está llena.</p>`:`
  <div class="panel"><label for="nom"><b>Nombre de tu empresa</b></label><input type="text" id="nom" maxlength="18" placeholder="Ej.: Constructora Caribe" style="margin-top:8px">
  <div style="margin-top:14px"><b>Tu color</b></div><div class="colores">${COLORS.map(c=>`<button data-c="${c}" style="background:${c}" class="${c===myColor?'sel':''}" ${taken.includes(c)?'disabled':''} aria-label="Color"></button>`).join('')}</div>
  <div class="acc">${btn('entrar','Entrar')}</div></div>`}
  <p class="txt" style="margin-top:14px">Ya están: ${V.players.length?V.players.map((p,i)=>chip(i)).join(' '):'nadie todavía'}</p>`);
  $$('[data-c]').forEach(b=>b.onclick=()=>{myColor=b.dataset.c;$$('[data-c]').forEach(x=>x.classList.toggle('sel',x===b))});
  if($('#entrar'))$('#entrar').onclick=()=>{const name=$('#nom').value.trim();if(!name){toast('Escribe el nombre de tu empresa');return}send({t:'join',name,color:myColor});beep()};
}
function lobby(){
  const host=V.players[V.me].id===V.host, url=location.origin+location.pathname+'?sala='+V.code, taken=V.players.map(p=>p.color);
  screen(`<div class="carta dorso"><div><div class="txt" style="color:var(--gris)">Código de la sala</div><div class="codigo">${esc(V.code)}</div><div style="margin-top:12px">${V.players.length} de 8 jugadores</div></div></div>`,
  `<div class="paso">Sala de espera</div><h2>Comparte el enlace con tu grupo</h2><div class="link" id="url">${esc(url)}</div>
  <div class="acc">${btn('copiar','Copiar enlace','ghost')}</div>
  <div class="panel"><b>Jugadores</b><div class="fila">${V.players.map((p,i)=>`<span class="chip"><span class="dot" style="background:${p.color}"></span>${esc(p.name)}${i===V.me?' (tú)':''}${p.id===V.host?' · anfitrión':''}${p.online?'':' · desconectado'}</span>`).join('')}</div>
  <div style="margin-top:12px"><b>Cambiar mi color</b></div><div class="colores">${COLORS.map(c=>`<button data-c="${c}" style="background:${c}" class="${c===P(V.me).color?'sel':''}" ${taken.includes(c)&&c!==P(V.me).color?'disabled':''} aria-label="Color"></button>`).join('')}</div></div>
  ${host?`<div class="modo"><button id="mn" class="${V.novato?'sel':''}"><b>Modo novato</b>3 modalidades, sin dado ni eventos. Meta: 15.</button><button id="mc" class="${V.novato?'':'sel'}"><b>Modo completo</b>5 modalidades, dado de TRM y eventos. Meta: 30.</button></div>
  <div class="acc">${btn('start','Empezar la partida','pri',V.players.length<2)}</div><p class="txt estado">${V.players.length<4?'Recomendado: 4 jugadores o más.':'¡Listos para jugar!'}</p>`
  :wait(`Esperando a que ${esc(V.players.find(p=>p.id===V.host)?.name||'el anfitrión')} empiece · ${V.novato?'modo novato':'modo completo'}`)}`);
  $('#copiar').onclick=async()=>{try{await navigator.clipboard.writeText(url);toast('Enlace copiado ✓')}catch(e){toast('Copia el enlace a mano')}};
  $$('[data-c]').forEach(b=>b.onclick=()=>act('color',{color:b.dataset.c}));
  if(host){$('#mn').onclick=()=>act('mode',{novato:true});$('#mc').onclick=()=>act('mode',{novato:false});$('#start').onclick=()=>{act('start');ding()}}
}
function game(){
  const s=V.s||{}, me=V.me, ctrl=isCtrl(), ordN=nm(V.ord), c=V.card;
  const L=cardHTML(c); let R='';
  switch(V.step){
  case 'publicar':
    R=`<div class="paso">Paso 1 · Publicar</div><h2>${ordN} voltea la carta del mazo SECOP</h2><p class="txt">${me===V.ord?'Eres el Ordenador del gasto: tú diriges este turno.':''}</p>
    ${ctrl?`<div class="acc">${btn('flip','Voltear carta')}</div>`:wait(`Esperando a ${ordN}`)}`;break;
  case 'evento':
    R=`<div class="paso">¡Sorpresa! Salió un evento</div><h2>${esc(c.t)}</h2><p class="txt">${esc(c.pasa)} Ya se aplicó.</p><p class="txt"><b>Qué enseña:</b> ${esc(c.ens)}</p>
    ${ctrl?`<div class="acc">${btn('seg','Voltear otra carta')}</div>`:wait(`Esperando a ${ordN}`)}`;break;
  case 'revisar':{
    const m=MOD[c.m];
    R=`<div class="paso">Paso 2 · Revisar documentos</div><h2>${m.t}: pide ${m.docs.split('').map(k=>DOCN[k]).join(', ')}</h2><p class="txt">${esc(c.o)}.</p>
    <div class="fila">${V.players.map((p,i)=>{const f=m.docs.split('').filter(k=>!p.docs[k]);return `<span class="chip ${f.length?'mal':''}"><span class="dot" style="background:${p.color}"></span>${nm(i)} ${f.length?'· le falta '+f.join(', '):'✓'}</span>`}).join('')}</div>
    <p class="txt" style="margin-top:12px">${s.pend&&s.pend.length?'A quien le falte un documento podrá subsanarlo con una pregunta o un reto.':'Todos tienen sus documentos al día.'}</p>
    ${ctrl?`<div class="acc">${btn('seg',s.pend&&s.pend.length?'Pasar a subsanar':'Competir')}</div>`:wait(`Esperando a ${ordN}`)}`;break;}
  case 'subsanar':{
    const perf=s.p, mine=me===perf;
    R=`<div class="paso">Paso 3 · Subsanar</div>`;
    if(!s.mode){R+=mine?`<h2>Te falta un documento</h2><p class="txt">Escoge cómo recuperarlo. Si lo logras, compites en este contrato.</p><div class="acc"><button id="sp" style="background:${C.morado};color:var(--papel)">Pregunta</button><button id="sr" style="background:${C.vino};color:var(--papel)">Reto</button>${btn('sn','No subsanar','ghost')}</div>`
      :`<h2>${nm(perf)} está subsanando</h2>${wait('Está escogiendo entre pregunta o reto')}`}
    else if(s.mode==='pregunta'){
      R+=`<h2>${mine?'Responde tu pregunta':nm(perf)+' responde una pregunta'}</h2>${qPanel(s.q,{gone:s.gone||[],r:s.r,pick:s.pick,click:mine&&!s.result})}
      ${mine&&!s.result&&P(me).com>0&&!(s.gone||[]).length?`<div class="acc">${btn('com',`Usar comodín 50/50 (te quedan ${P(me).com})`,'ghost')}</div>`:''}
      ${s.result?`<p class="txt" style="margin-top:12px"><b>${s.result==='ok'?'¡Correcto! El documento vuelve a estar vigente.':'No era esa: esta vez no compite.'}</b></p>${(mine||ctrl)?`<div class="acc">${btn('seg','Seguir')}</div>`:''}`:''}`;
    } else {
      const t=RT[s.tipo], judge=me===s.judge;
      if(s.result){R+=`<h2>${s.result==='ok'?'¡Reto logrado!':'Reto no logrado'}</h2><p class="txt">Era: <b>${esc(s.reto?.w)}</b></p>${(mine||ctrl)?`<div class="acc">${btn('seg','Seguir')}</div>`:wait('Esperando para seguir')}`}
      else if(mine){R+=`<div class="panel" style="background:var(--papel);color:var(--tinta)"><div class="paso" style="color:${C.vino}">${t[0]} · solo tú lo ves</div><h2 style="color:var(--tinta)">${esc(s.reto?.w)}</h2><p>${t[1]}</p>${s.reto?.p?`<p style="color:${C.rojo};font-weight:800">Prohibido: ${s.reto.p.map(esc).join(' · ')}</p>`:''}</div>
        ${s.ends?`<div class="big" data-ends="${s.ends}">${remain(s.ends)}</div>${wait(`${nm(s.judge)} decide si lo lograste`)}`:`<div class="acc">${btn('rs','Empezar el tiempo')}</div>`}`}
      else{R+=`<h2>${nm(perf)} hace un reto de ${t[0].toLowerCase()}</h2><p class="txt">${s.tipo==='rapido'?'Escucha y revisa si lo cumple.':'¡Adivina en voz alta! El primero que adivine gana 1 punto.'}</p>
        ${s.ends?`<div class="big" data-ends="${s.ends}">${remain(s.ends)}</div>`:wait(`${nm(perf)} está leyendo su reto`)}
        ${judge&&s.ends?`<div class="panel"><b>Tú eres el juez.</b> ${s.reto?`La palabra era: <b>${esc(s.reto.w)}</b>`:''}<div class="acc">${s.tipo==='rapido'?`${btn('jok','Lo cumplió')}${btn('jno','No lo cumplió','ghost')}`:V.players.map((p,i)=>i===perf?'':`<button data-g="${i}" style="background:${p.color};color:var(--papel)">Adivinó ${esc(p.name)}</button>`).join('')+btn('jno','Nadie adivinó','ghost')}</div></div>`:''}`}
    }
    break;}
  case 'oferta':{
    const el=s.el.includes(me);
    R=`<div class="paso">Paso 4 · Ofertas en secreto (${s.done.length} de ${s.el.length})</div>`;
    if(el&&s.mine===undefined)R+=`<h2>¿Cuánto cobras?</h2><p class="txt">En % del presupuesto. Barato gana más seguido; caro da más puntos. Nadie ve tu oferta hasta que todos elijan.</p>
      <div class="ofs">${[80,85,90,95,100].map(v=>`<button data-v="${v}">${v}%<small>+${(v-75)/5} pts</small></button>`).join('')}</div>`;
    else R+=`<h2>${el?`Tu oferta: ${s.mine}%`:'No compites en este contrato'}</h2>${wait('Esperando a: '+s.el.filter(i=>!s.done.includes(i)).map(nm).join(', '))}`;
    break;}
  case 'revela':{
    const lic=c.m==='licitacion'&&!V.novato;
    R=`<div class="paso">Paso 4 · Se revelan las ofertas</div><h2>¡Todas al tiempo!</h2>${tiles(s.offers)}
    ${lic?`<div class="dado">DADO<br>DE TRM</div>`:''}${ctrl?`<div class="acc">${btn(lic?'dado':'seg',lic?'Lanzar el dado de TRM':'Ver quién gana')}</div>`:wait(`Esperando a ${ordN}`)}`;break;}
  case 'desempate':{
    const mine=s.cand.includes(me)&&s.ans[me]===undefined;
    R=`<div class="paso">Desempate · ${esc(s.label)}</div>${s.rule?`<div class="dado ${Date.now()+skew-(s.rolledAt||0)<2500?'gira':''}">${RULE[s.rule]}</div>`:''}${tiles(s.offers,s.cand)}
    <h2 style="margin-top:14px">Empate entre ${s.cand.map(nm).join(' y ')}: gana el primero que acierte</h2>${qPanel(s.q,{click:mine,pick:s.ans[me]})}
    ${s.ans[me]!==undefined?wait('Respondiste. Esperando a los demás.'):''}`;break;}
  case 'subasta':{
    const el=s.el.includes(me), next=s.price===null?100:s.price-5;
    R=`<div class="paso">Paso 4 · Subasta inversa en vivo</div><h2>${s.who===null?'Arranca en 100 %':nm(s.who)+' va ganando'}</h2><div class="big">${s.price??100}%</div>
    <p class="txt">${s.who===null?'El primero que toque acepta 100 %. Cada lance baja 5 %.':'Si nadie baja, gana en <b data-ends="'+s.ends+'">'+remain(s.ends)+'</b> s'}</p>
    ${el?`<div class="acc"><button id="puja" style="font-size:22px;padding:18px 28px;background:${P(me).color};color:var(--papel)" ${next<80||s.who===me?'disabled':''}>${s.who===me?'¡Vas ganando!':next<80?'Ya no se puede bajar':'Bajar a '+next+' %'}</button></div>`:wait('No compites en este contrato')}
    ${ctrl&&s.who===null?`<div class="acc">${btn('des','Nadie acepta: desierto','ghost')}</div>`:''}`;break;}
  case 'concurso':{
    const mine=s.cand.includes(me)&&s.ans[me]===undefined;
    R=`<div class="paso">Paso 4 · Concurso de méritos</div><h2>${me===V.ord?'Tú no compites: lee la pregunta en voz alta':'¡Responde rápido! Gana el primero que acierte'}</h2>${qPanel(s.q,{click:mine,pick:s.ans[me]})}
    ${s.ans[me]!==undefined?wait('Respondiste. Esperando a los demás.'):''}`;break;}
  case 'adjudica':{
    const p=P(s.w);
    R=`<div class="paso">Paso 5 · Adjudicar</div>${s.rule?`<div class="dado ${Date.now()+skew-(s.rolledAt||0)<2500?'gira':''}">${RULE[s.rule]}</div>`:''}
    ${s.offers?tiles(s.offers,[s.w]):''}<div style="margin-top:14px"><span class="sello" style="font-size:clamp(26px,6vw,40px)">¡ADJUDICADO!</span></div>
    <h2 style="margin-top:12px">a ${nm(s.w)}</h2><p class="txt">${esc(s.why)}</p>
    <div class="panel">Carta: <b>+${s.base}</b>${s.offer?` · Oferta ${s.offer} %: <b>+${s.b}</b>`:''}${s.ad?` · Adenda: <b>+${s.ad}</b>`:''}<div class="big" style="font-size:52px;color:${p.color}">+${s.tot}</div></div>
    ${ctrl?`<div class="acc">${btn('seg','Paso 6 · Pasar la ficha')}</div>`:wait(`Esperando a ${ordN}`)}`;break;}
  case 'desierto':
    R=`<div class="paso">Contrato desierto</div><h2>Nadie gana este contrato</h2><p class="txt">${esc(s.why)}</p>${ctrl?`<div class="acc">${btn('seg','Siguiente turno')}</div>`:wait(`Esperando a ${ordN}`)}`;break;
  }
  screen(L,R);
  const on=(id,f)=>{const e=$('#'+id);if(e)e.onclick=f};
  on('flip',()=>{act('flip');beep(400)});on('seg',()=>act('seguir'));on('dado',()=>{act('dado');beep(300)});
  on('sp',()=>act('subsanar',{como:'pregunta'}));on('sr',()=>act('subsanar',{como:'reto'}));on('sn',()=>act('subsanar',{como:'no'}));
  on('com',()=>act('comodin'));on('rs',()=>act('retoStart'));on('jok',()=>act('juzgar',{ok:true}));on('jno',()=>act('juzgar',{ok:false}));on('des',()=>act('desierto'));
  on('puja',()=>{act('puja');beep(700,.05)});
  $$('[data-g]').forEach(b=>b.onclick=()=>act('juzgar',{ok:true,g:+b.dataset.g}));
  $$('[data-v]').forEach(b=>b.onclick=()=>{act('oferta',{v:+b.dataset.v});beep(300)});
  $$('.opts button[data-i]').forEach(b=>b.onclick=()=>{if(b.disabled)return;
    if(V.step==='subsanar')act('responder',{i:+b.dataset.i});else act('resp',{i:+b.dataset.i})});
}
function fin(){
  const w=V.players.find(p=>p.id===V.winner)||V.players[0], host=V.me>=0&&V.players[V.me].id===V.host;
  screen(`<div class="carta" style="display:grid;place-items:center;text-align:center"><div><span class="sello" style="font-size:28px">¡ADJUDICADO!</span><div class="big" style="color:${w.color};margin-top:18px">${w.score}</div><b>puntos</b></div></div>`,
  `<div class="paso">Fin de la partida</div><h2>¡${esc(w.name)} gana el juego!</h2><p class="txt">Llegó primero a ${V.meta} puntos.</p>
  <div class="fila">${V.players.map((p,i)=>[p,i]).sort((a,b)=>b[0].score-a[0].score).map(([p,i])=>`<span class="chip"><span class="dot" style="background:${p.color}"></span>${nm(i)} · ${p.score}</span>`).join('')}</div>
  ${host?`<div class="acc">${btn('nueva','Jugar otra vez con el mismo grupo')}</div>`:wait('El anfitrión puede empezar otra partida')}`);
  if($('#nueva'))$('#nueva').onclick=()=>act('nueva');
}
function render(){
  score();
  const key=V.phase+V.step+V.turn; if(key!==lastStep){if(V.step==='adjudica'||V.phase==='fin')ding();lastStep=key}
  if(V.me<0)return joinForm();
  if(V.phase==='lobby')return lobby();
  if(V.phase==='fin')return fin();
  game();
}
setInterval(()=>{$$('[data-ends]').forEach(e=>{const r=remain(+e.dataset.ends);if(e.textContent!==String(r)){e.textContent=r;if(r<=3&&r>0)beep(880,.04)}})},250);
if(!code)landing();else connect();
}
</script>
</body>
</html>
